<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Karim Majed — Backend software engineer. C# / .NET, Azure, SQL, and REST APIs."
    />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('portfolio-theme')
          const next = theme === 'light' || theme === 'dark' ? theme : 'dark'
          document.documentElement.dataset.theme = next
          document.documentElement.style.colorScheme = next
        } catch (_) {
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.style.colorScheme = 'dark'
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Red+Hat+Mono:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>Karim Majed — Backend software engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
