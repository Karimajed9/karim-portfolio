server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: browser calls /api/* → Spring Boot container
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stable CV PDF paths (admin can overwrite without rebuilding the static site)
    location /cv/ {
        proxy_pass http://backend:8080/cv/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin-uploaded project covers and other media
    location /media/ {
        proxy_pass http://backend:8080/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /admin is its own file, not the homepage fallback, so noindex is on the response.
    location = /admin {
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Robots-Tag "noindex" always;
        try_files /admin/index.html =404;
    }

    # SPA document: index.html and client routes that are not their own files.
    # frame-ancestors is ignored in a meta tag, so the HTML response itself must send it.
    location / {
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
