# Render Blueprint — free-tier API + Postgres (when free plans are available).
# Karim must connect the repo in the Render dashboard (this file alone does not create resources).
# Dashboard: New → Blueprint → select this repo → apply.
#
# Caveats (free):
# - Web Service sleeps after ~15 min idle; first request can take 30–60s.
# - The API uses the migrated Neon Postgres. Set SPRING_DATASOURCE_URL,
#   SPRING_DATASOURCE_USERNAME, and DB_PASSWORD in the dashboard (sync: false).
#   The JDBC URL must include sslmode=require. karim-portfolio-db stays declared.
# - Do NOT upgrade to paid plans for this portfolio unless you opt in.

databases:
  - name: karim-portfolio-db
    plan: free
    databaseName: portfolio
    user: portfolio

services:
  - type: web
    name: karim-portfolio-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8080"
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://karimmajed.com,https://www.karimmajed.com,https://karimajed9.github.io,http://localhost:5173,http://localhost:3000
      - key: APP_STORAGE_MODE
        # local stores uploads in Postgres (stored_blob), not the container disk.
        value: local
      # Session cookie Secure. The app reads SESSION_COOKIE_SECURE into
      # server.servlet.session.cookie.secure. HttpOnly stays on, SameSite stays lax.
      # Do not set SESSION_COOKIE_SAME_SITE=none.
      # A service created by hand will not pick this up until the blueprint is applied
      # or the same variable is set in the Render dashboard.
      - key: SESSION_COOKIE_SECURE
        value: "true"
      # Optional: paste Azure Application Insights connection string in the dashboard (never commit it).
      - key: APPLICATIONINSIGHTS_CONNECTION_STRING
        sync: false
      # Existing Blueprint: sync: false is ignored on update, so set these in the dashboard.
      # Do not put the Neon URL or password in this file.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
