# Unused for production. karimmajed.com is Azure Static Web Apps
# (.github/workflows/azure-static-web-apps.yml). This workflow can publish a Pages copy.
# Enable only if you want that copy: Repo Settings → Pages → Source = GitHub Actions.
# Vite base defaults to "/".
# Optional repo Variables:
#   VITE_API_BASE_URL = https://<your-render-api>.onrender.com
#   VITE_BASE_PATH    = /karim-portfolio/   # only if you need github.io/project path without CNAME
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-node v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build for GitHub Pages
        run: npm run build
        env:
          # Default "/" for karimmajed.com. Set Actions var VITE_BASE_PATH=/karim-portfolio/ for project-path-only github.io.
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          # Empty → relative /api/... (fails until Render is wired; SPA falls back to static site.ts)
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      # Unused for production. Pages cannot set Content-Security-Policy.
      # Production frame-ancestors is in frontend/public/staticwebapp.config.json,
      # which the Vite build copies to dist/ for the Azure Static Web Apps upload.
      # Client-side routes (e.g. /about) need a 404.html that serves the SPA shell.
      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      # actions/upload-pages-artifact v3
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: frontend/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        # actions/deploy-pages v4
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
