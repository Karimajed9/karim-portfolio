# Free CI only: build + test on push/PR to main.
# No Azure login, no deploy jobs, no Bicep — deferred until ready to spend/use free credit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (npm test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-node v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (mvnw test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-java v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers needs Docker; ubuntu-latest runners provide it.
      - name: Run tests
        run: chmod +x mvnw && ./mvnw test
