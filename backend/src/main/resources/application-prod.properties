# Production profile hints (activate with: --spring.profiles.active=prod).
# Do NOT put real secrets here.
#
# Free host (Render) — set as service env vars (see docs/DEPLOY-FREE.md / render.yaml):
#   PORT, DB_HOST, DB_PORT, DB_NAME, SPRING_DATASOURCE_USERNAME, DB_PASSWORD
#   ADMIN_PASSWORD, CORS_ALLOWED_ORIGINS, APP_STORAGE_MODE=local
#   SESSION_COOKIE_SECURE=true, SESSION_COOKIE_SAME_SITE=none (cross-site admin cookie)
#
# Azure App Service later — map Key Vault / App Settings to:
#   DB_PASSWORD, ADMIN_PASSWORD
#   AZURE_STORAGE_CONNECTION_STRING   OR Managed Identity + AZURE_STORAGE_ACCOUNT_NAME
#   AZURE_STORAGE_CONTAINER, APPLICATIONINSIGHTS_CONNECTION_STRING
# App Insights: see docs/application-insights.md (runtime attach + applicationinsights.json sampling)
#
# Prefer Managed Identity for Blob when possible:
#   app.storage.mode=azure
#   AZURE_STORAGE_ACCOUNT_NAME=<your-account>
#   AZURE_STORAGE_CONTAINER=portfolio-uploads

# Default prod hint still points at Azure blob; on Render leave APP_STORAGE_MODE=local
# and do not activate this profile unless you intend Azure storage.
app.storage.mode=azure
