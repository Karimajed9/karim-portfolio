# Production profile hints (activate with: --spring.profiles.active=prod).
# Do NOT put real secrets here. On Azure App Service, map Key Vault secrets
# (or App Settings) to the same env var names used locally:
#
#   DB_PASSWORD              <- Key Vault secret / App Setting
#   ADMIN_PASSWORD           <- Key Vault secret / App Setting
#   AZURE_STORAGE_CONNECTION_STRING   OR use Managed Identity + AZURE_STORAGE_ACCOUNT_NAME
#   AZURE_STORAGE_CONTAINER  <- optional (default portfolio-uploads)
#   APPLICATIONINSIGHTS_CONNECTION_STRING
#
# App Service "Key Vault references" inject secret values as environment variables
# at runtime, so existing ${DB_PASSWORD} / ADMIN_PASSWORD wiring keeps working
# without a Key Vault SDK in-process.
#
# Prefer Managed Identity for Blob when possible (no connection string in config):
#   app.storage.mode=azure
#   AZURE_STORAGE_ACCOUNT_NAME=<your-account>
#   AZURE_STORAGE_CONTAINER=portfolio-uploads

app.storage.mode=azure
