spring.application.name=portfolio
# Render sets PORT; local default 8080
server.port=${PORT:8080}
# Override with SPRING_DATASOURCE_URL, or set DB_HOST / DB_PORT / DB_NAME (Render Blueprint)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portfolio}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Comma-separated browser origins (GitHub Pages origin has no path)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000,https://karimmajed.com,https://www.karimmajed.com,https://karimajed9.github.io}

# --- Blob storage (local by default; Azure when credentials are set) ---
# mode: auto | local | azure
app.storage.mode=${APP_STORAGE_MODE:auto}
app.storage.local-dir=${APP_STORAGE_LOCAL_DIR:./data/uploads}
app.storage.azure.container=${AZURE_STORAGE_CONTAINER:portfolio-uploads}
app.storage.azure.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
app.storage.azure.account-name=${AZURE_STORAGE_ACCOUNT_NAME:}

# Multipart uploads (admin hook POST /api/admin/uploads)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Admin session cookie (httpOnly). For cross-site Pages→API set:
#   SESSION_COOKIE_SECURE=true and SESSION_COOKIE_SAME_SITE=none
server.servlet.session.timeout=${ADMIN_SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}

# Admin login lockout / rate limit (single instance)
admin.login.max-failed-attempts=${ADMIN_LOGIN_MAX_FAILED_ATTEMPTS:5}
admin.login.lockout-ms=${ADMIN_LOGIN_LOCKOUT_MS:900000}
admin.login.rate-limit.requests=${ADMIN_LOGIN_RATE_LIMIT_REQUESTS:10}
admin.login.rate-limit.window-ms=${ADMIN_LOGIN_RATE_LIMIT_WINDOW_MS:60000}

# Request logging (CommonsRequestLoggingFilter) — DEBUG enables the lines
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG