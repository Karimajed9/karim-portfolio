# This file shadows src/main/resources/application.properties on the test classpath.
# Keep placeholders that main defines without defaults (and any new required keys) here.
# @ServiceConnection overrides the real JDBC URL/credentials.
spring.datasource.password=unused

# Required admin password (no runtime default). Tests only — not a production secret.
ADMIN_PASSWORD=test-admin-password

# CORS (WebConfig) — same default as main; avoids PlaceholderResolutionException in tests
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000,https://karimmajed.com,https://www.karimmajed.com,https://karimajed9.github.io

# This file replaces main application.properties, so the cookie lines have to be repeated.
# ApiIntegrationTests sets SESSION_COOKIE_SECURE=true. SameSite stays lax.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.path=/
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
